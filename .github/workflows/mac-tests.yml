name: Mac-Tests

on: [push, pull_request, workflow_dispatch]

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CTEST_NO_TESTS_ACTION: error

jobs:
  build-and-test:
    strategy:
      fail-fast: false

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -S . -B build \
          -DBASEXX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/tests